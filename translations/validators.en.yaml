jpmmartin_carrier:
    shipping_origin:
        channel:
            unique: This channel already has a shipping origin.
        default_destination_type:
            not_blank: Choose whether deliveries go to homes or businesses when the buyer has not said.
        weight_unit:
            same_as_other_origins: Every shipping origin must use the same units. The others use {{ unit }}.
        dimension_unit:
            same_as_other_origins: Every shipping origin must use the same units. The others use {{ unit }}.
    shipping_method:
        service:
            invalid: Choose one of the services of this carrier.
        failure_policy:
            invalid: Choose whether this shipping method is hidden or offered at a flat amount when the carrier does not answer.
        flat_amount:
            required: Enter the flat amount for the channel {{ channel }}.
    order:
        shipping_method_unavailable: The shipping method {{ shipping_method }} is not available right now. Please choose another shipping method.
    checkout:
        destination_type:
            not_blank: Tell us whether we are delivering to a home or a business.
    package_box:
        outer_length:
            too_long: Carriers do not accept a box this long. The longest outer side can be at most {{ limit }} {{ unit }}.
            length_plus_girth_too_large: Carriers do not accept a box this large. The longest outer side plus the girth around the other two can be at most {{ limit }} {{ unit }}.
    credentials:
        carrier:
            unique: This carrier already has credentials.
        environment:
            not_blank: Choose whether these credentials go against the sandbox or production.
        pickup_type:
            not_blank: Choose how packages reach the carrier, since it changes the rates.
        account_number:
            required_for_fedex: FedEx needs an account number to quote rates.
    customs_data:
        hs_code:
            invalid: '"%hs_code%" is not a Harmonized System code: it must be six to ten digits.'
        country_of_origin:
            invalid: Choose a country that exists.
