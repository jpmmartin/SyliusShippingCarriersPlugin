# Installs this plugin into a store that has never seen it, by running the commands the README
# publishes and mirroring the file edits it shows, and checks that the store ends up working.
name: Install

on:
    release:
        types: [published]
    pull_request:
        # Only the things that can break an installation. A pull request touching a handler pays nothing
        # for this job.
        paths:
            - 'README.md'
            - 'config/**'
            - 'src/DependencyInjection/**'
            - 'src/Migrations/**'
            - 'composer.json'
            - 'bin/extract-readme-commands'
            - 'bin/apply-readme-edits'
            - '.github/workflows/install.yaml'
    workflow_dispatch: ~

permissions:
    contents: read

jobs:
    install:
        name: "A store that has never seen this plugin, installed from the README"
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            APP_ENV: dev
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/store?serverVersion=16&charset=utf8

        steps:
            - name: Check out the plugin
              uses: actions/checkout@v5
              with:
                  path: plugin

            # 8.4, not the 8.2 the plugin itself supports, and the reason is the store rather than the
            # plugin: Sylius Standard 2.2 requires PHP 8.3. Whether the plugin works on 8.2 is
            # build.yaml's question.
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, gd, opcache, pdo_pgsql, pgsql, sodium
                  tools: composer:v2
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: '22.x'

            - name: Enable Yarn
              run: corepack enable

            - name: Cache Composer
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/files
                  key: "${{ runner.os }}-install-composer-${{ hashFiles('plugin/composer.json') }}"
                  restore-keys: "${{ runner.os }}-install-composer-"

            # Everything below runs against this, and it is thrown away with the runner. It is not the
            # plugin's own test application: that one arrives pre-wired, which is exactly what makes it
            # unable to prove anything about installing.
            - name: Create a throwaway store
              run: composer create-project sylius/sylius-standard store --no-interaction --no-scripts

            # Copied into vendor/, not symlinked, because a copy is what Packagist gives a reader.
            - name: Point it at the plugin under test
              working-directory: store
              run: |
                  composer config repositories.plugin '{"type": "path", "url": "../plugin", "options": {"symlink": false}}'
                  composer config minimum-stability dev

            # The README does not say to do any of this, and should not: a reader is installing into a
            # store that already has its database, its sample data and its front end built. A runner has
            # an empty PostgreSQL and nothing else, so the job supplies what a real store already had.
            - name: Give the store what a real one already has
              working-directory: store
              run: |
                  set -euo pipefail
                  bin/console doctrine:database:create --if-not-exists
                  bin/console doctrine:migrations:migrate --no-interaction
                  bin/console sylius:fixtures:load default --no-interaction
                  yarn install --silent
                  yarn build
                  bin/console assets:install
                  # To check the ignore rule of step 4 against git itself.
                  git init -q

            # **The commands come out of the README.** A workflow carrying its own copy would prove the
            # plugin installs and say nothing about whether the documentation is right — somebody
            # changes a step, updates the workflow, forgets the README, and this stays green. That is the
            # failure this job exists to prevent.
            - name: Read the install commands out of the README
              run: |
                  php plugin/bin/extract-readme-commands \
                      --readme=plugin/README.md \
                      --until="## Setting up the store" \
                      | tee commands.txt
                  test -s commands.txt

            # **The file edits are mirrored, not extracted, and that half is weaker.** The bundle line is a
            # fragment beside a `// ...`, and the ignore rule is a line in a file the store owns; there is
            # no honest way to turn a fragment into a file. Change one of those blocks in the README and
            # bin/apply-readme-edits must change with it. Nothing here can catch that; only a reader can.
            - name: Apply the file edits the README shows
              working-directory: store
              run: php ../plugin/bin/apply-readme-edits ../plugin/README.md .

            - name: Run the README's own commands, in the order it gives them
              working-directory: store
              run: |
                  set -euo pipefail
                  # Each command gets /dev/null as its input. Without that, the first one that reads stdin
                  # — composer and bin/console both do — swallows the rest of the file, and the job passes
                  # having run one of three commands.
                  while IFS= read -r command <&3; do
                      echo "::group::$command"
                      eval "$command" < /dev/null
                      echo '::endgroup::'
                  done 3< ../commands.txt

            # ── What a half-finished install costs ───────────────────────────────────────────────────
            # Each of these fails silently in a real store, and each check names the step it belongs to.

            - name: The bundle registered
              working-directory: store
              run: |
                  bin/console debug:container --tag=sylius.shipping_calculator | grep -q 'ups_rate' \
                      || { echo 'UPS rates is not among the calculators. Step 2 — register the bundle.'; exit 1; }

            - name: The configuration and the routes were imported
              working-directory: store
              run: |
                  bin/console debug:config sylius_twig_hooks | grep -q 'JpmMartinSyliusShippingCarriersPlugin' \
                      || { echo "None of the plugin's hooks is registered. Step 3 — import the configuration."; exit 1; }
                  bin/console debug:router jpmmartin_carrier_admin_credentials_index | grep -q '/admin/carrier-credentials/' \
                      || { echo 'The admin routes are missing, or mounted outside /admin/. Step 3 — import the routes with their prefix.'; exit 1; }

            - name: The key exists, and git would not commit it
              working-directory: store
              run: |
                  test -s config/encryption/jpmmartin_carrier.key \
                      || { echo 'No key at config/encryption/jpmmartin_carrier.key. Step 4.'; exit 1; }
                  git check-ignore -q config/encryption/jpmmartin_carrier.key \
                      || { echo 'The key would be committed. Step 4 — the .gitignore line.'; exit 1; }

            - name: The migrations created the plugin's tables
              working-directory: store
              run: |
                  # Counted exactly. `grep -q 11` would match an 11 anywhere in the table the console draws.
                  tables=$(bin/console dbal:run-sql \
                      "SELECT count(*) AS n FROM information_schema.tables WHERE table_name LIKE 'jpmmartin_carrier_%'" \
                      | grep -oE '[0-9]+' | tail -1)
                  test "$tables" = '11' \
                      || { echo "Expected 11 plugin tables, found ${tables:-none}. Step 5 — run the migrations."; exit 1; }

            # Everything above proves the parts exist. Nothing proves a page renders — and a route the menu
            # links to that does not exist, or a missing table, shows up here, loudly.
            - name: The shop and the admin answer
              working-directory: store
              run: |
                  cat > public/router.php <<'PHP'
                  <?php
                  // PHP's built-in server hands static files back itself and everything else to Symfony.
                  if (is_file(__DIR__ . parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH))) {
                      return false;
                  }
                  require __DIR__ . '/index.php';
                  PHP
                  # `variables_order=EGPCS`, because PHP's built-in server hands the environment to getenv()
                  # only, and Symfony's Dotenv looks in $_SERVER and $_ENV before falling back to the store's
                  # .env, whose database is not this one.
                  php -S 127.0.0.1:8000 -d variables_order=EGPCS -t public public/router.php > server.log 2>&1 &
                  for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
                  status=$(curl -s -o homepage.html -w '%{http_code}' http://127.0.0.1:8000/en_US/)
                  test "$status" = '200' \
                      || { echo "The shop's homepage answered $status."; grep -o '<title>[^<]*' homepage.html | head -1; exit 1; }
                  # The fixtures' administrator. The admin draws the plugin's menu on every page, so a
                  # missing route shows up on the dashboard; the credentials page reads the plugin's table.
                  jar=$(mktemp)
                  token=$(curl -s -c "$jar" -b "$jar" http://127.0.0.1:8000/admin/login \
                      | grep -oE 'name="_csrf_admin_security_token" value="[^"]+"' | cut -d'"' -f4)
                  curl -s -o /dev/null -c "$jar" -b "$jar" -X POST http://127.0.0.1:8000/admin/login-check \
                      --data-urlencode '_username=sylius' --data-urlencode '_password=sylius' \
                      --data-urlencode "_csrf_admin_security_token=$token"
                  for page in /admin/ /admin/carrier-credentials/; do
                      status=$(curl -s -o page.html -w '%{http_code}' -b "$jar" "http://127.0.0.1:8000$page")
                      test "$status" = '200' \
                          || { echo "$page answered $status."; grep -o '<title>[^<]*' page.html | head -1; tail -20 server.log; exit 1; }
                  done
                  grep -q 'Carrier credentials' page.html \
                      || { echo 'The credentials page does not say what it is.'; exit 1; }
