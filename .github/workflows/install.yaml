# Installs this plugin into a store that has never seen it, two ways — by running the commands the
# README publishes and mirroring the file edits it shows, and by letting the Flex recipe in `recipe/`
# do the file edits — and upgrades a third store, which has the release before this one with data and
# a configuration of its own, to this one. All three end in the same checks of a working store.
name: Install

on:
    release:
        types: [published]
    pull_request:
        # Only the things that can break an installation. A pull request touching a handler pays nothing
        # for this job.
        paths:
            - 'README.md'
            - 'recipe/**'
            - 'config/**'
            - 'src/DependencyInjection/**'
            - 'src/Migrations/**'
            - 'composer.json'
            - 'bin/extract-readme-commands'
            - 'bin/apply-readme-edits'
            - '.github/workflows/install.yaml'
    workflow_dispatch:
        inputs:
            recipe_source:
                description: "Where the recipe job takes the recipe from"
                type: choice
                default: local
                options:
                    # `recipe/` here, compiled and served by the runner: what a change to the recipe must
                    # pass before it is proposed.
                    - local
                    # symfony/recipes-contrib, through the store's own default endpoints: what a reader
                    # actually gets. Only meaningful once the recipe is merged there.
                    - contrib

permissions:
    contents: read

jobs:
    install:
        # The first two keep the name they always had, which is what a required check would be naming.
        name: "${{ matrix.path == 'upgrade' && 'A store on the previous release, upgraded to this one' || format('A store that has never seen this plugin, installed from the {0}', matrix.path) }}"
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # `readme`: the README's own commands, extracted, and its file edits, mirrored.
                # `recipe`: the Flex recipe in `recipe/`, compiled into an endpoint the store is pointed at,
                # so that `composer require` does the file edits itself — which is what a Sylius Standard
                # store gets once the recipe is in symfony/recipes-contrib.
                # `upgrade`: the release before this commit, from Packagist with contrib's recipe, given a
                # configuration and data of its own, then upgraded to this commit and migrated. What it
                # proves is what docs/upgrading.md promises of a minor release: nothing written has to
                # change, and nothing stored is lost or altered.
                # All three end in the same checks.
                path: [readme, recipe, upgrade]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            APP_ENV: dev
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/store?serverVersion=16&charset=utf8
            # `local` on every automatic run: a push cannot wait for contrib to catch up with a recipe it
            # is changing. `contrib` is chosen by hand, to see what a reader gets.
            RECIPE_SOURCE: ${{ inputs.recipe_source || 'local' }}

        steps:
            # With its whole history and its tags, which is where the upgrade leg finds the release before
            # this commit. The repository is small enough that no leg pays for it noticeably.
            - name: Check out the plugin
              uses: actions/checkout@v5
              with:
                  path: plugin
                  fetch-depth: 0

            # 8.4, not the 8.2 the plugin itself supports, and the reason is the store rather than the
            # plugin: Sylius Standard 2.2 requires PHP 8.3. Whether the plugin works on 8.2 is
            # build.yaml's question.
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, gd, opcache, pdo_pgsql, pgsql, sodium
                  tools: composer:v2
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: '22.x'

            - name: Enable Yarn
              run: corepack enable

            - name: Cache Composer
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/files
                  key: "${{ runner.os }}-install-composer-${{ hashFiles('plugin/composer.json') }}"
                  restore-keys: "${{ runner.os }}-install-composer-"

            # Everything below runs against this, and it is thrown away with the runner. It is not the
            # plugin's own test application: that one arrives pre-wired, which is exactly what makes it
            # unable to prove anything about installing.
            - name: Create a throwaway store
              run: composer create-project sylius/sylius-standard store --no-interaction --no-scripts

            # Copied into vendor/, not symlinked, because a copy is what Packagist gives a reader. The upgrade
            # leg does this itself, once the release before this one is installed.
            - name: Point it at the plugin under test
              if: matrix.path != 'upgrade'
              working-directory: store
              run: |
                  composer config repositories.plugin '{"type": "path", "url": "../plugin", "options": {"symlink": false}}'
                  composer config minimum-stability dev

            # The README does not say to do any of this, and should not: a reader is installing into a
            # store that already has its database, its sample data and its front end built. A runner has
            # an empty PostgreSQL and nothing else, so the job supplies what a real store already had.
            - name: Give the store what a real one already has
              working-directory: store
              run: |
                  set -euo pipefail
                  bin/console doctrine:database:create --if-not-exists
                  bin/console doctrine:migrations:migrate --no-interaction
                  bin/console sylius:fixtures:load default --no-interaction
                  yarn install --silent
                  yarn build
                  bin/console assets:install
                  # To check the ignore rule of step 4 against git itself.
                  git init -q

            # ── The README path ──────────────────────────────────────────────────────────────────────

            # **The commands come out of the README.** A workflow carrying its own copy would prove the
            # plugin installs and say nothing about whether the documentation is right — somebody
            # changes a step, updates the workflow, forgets the README, and this stays green. That is the
            # failure this job exists to prevent.
            - name: Read the install commands out of the README
              if: matrix.path == 'readme'
              run: |
                  php plugin/bin/extract-readme-commands \
                      --readme=plugin/README.md \
                      --until="## Setting up the store" \
                      | tee commands.txt
                  test -s commands.txt

            # **The file edits are mirrored, not extracted, and that half is weaker.** The bundle line is a
            # fragment beside a `// ...`, and the ignore rule is a line in a file the store owns; there is
            # no honest way to turn a fragment into a file. Change one of those blocks in the README and
            # bin/apply-readme-edits must change with it. Nothing here can catch that; only a reader can.
            - name: Apply the file edits the README shows
              if: matrix.path == 'readme'
              working-directory: store
              run: php ../plugin/bin/apply-readme-edits ../plugin/README.md .

            - name: Run the README's own commands, in the order it gives them
              if: matrix.path == 'readme'
              working-directory: store
              run: |
                  set -euo pipefail
                  # Each command gets /dev/null as its input. Without that, the first one that reads stdin
                  # — composer and bin/console both do — swallows the rest of the file, and the job passes
                  # having run one of three commands.
                  while IFS= read -r command <&3; do
                      echo "::group::$command"
                      eval "$command" < /dev/null
                      echo '::endgroup::'
                  done 3< ../commands.txt

            # ── The recipe path ──────────────────────────────────────────────────────────────────────

            # The recipe is compiled the way symfony/recipes-contrib compiles its own, with the same tool,
            # from a tree laid out the way that repository is — `recipe/` here already is — and the lints
            # its bot runs on a pull request run here first.
            - name: Check out the recipes checker
              if: matrix.path == 'recipe' && env.RECIPE_SOURCE == 'local'
              uses: actions/checkout@v5
              with:
                  repository: symfony-tools/recipes-checker
                  path: recipes-checker

            - name: Compile the recipe into a Flex endpoint
              if: matrix.path == 'recipe' && env.RECIPE_SOURCE == 'local'
              run: |
                  set -euo pipefail
                  (cd recipes-checker && composer install --no-interaction --no-progress --prefer-dist)
                  # The generator writes into the output directory but does not create it.
                  mkdir -p recipes-tree endpoint && cp -r plugin/recipe/jpmmartin recipes-tree/
                  cd recipes-tree
                  git init -q && git add -A && git -c user.email=ci@example.invalid -c user.name=ci commit -q -m 'recipe'
                  git ls-tree HEAD */*/* | php ../recipes-checker/run lint:manifests
                  find . -name '*.yaml' | php ../recipes-checker/run lint:yaml
                  git ls-tree HEAD */*/* | php ../recipes-checker/run generate:flex-endpoint jpmmartin/SyliusShippingCarriersPlugin main flex/main ../endpoint/
                  test -s ../endpoint/index.json
                  grep -q '"jpmmartin/sylius-shipping-carriers-plugin"' ../endpoint/index.json

            # Where the recipe comes from is asserted, not assumed: the line Flex prints names the
            # repository it read, and a run that took the wrong one would otherwise look green.
            - name: Require the package and let the recipe do the files
              if: matrix.path == 'recipe'
              working-directory: store
              run: |
                  set -euo pipefail
                  if [ "$RECIPE_SOURCE" = 'local' ]; then
                      # Composer refuses a plain-http endpoint unless told otherwise; this store is thrown
                      # away with the runner.
                      (php -S 127.0.0.1:8765 -t ../endpoint > ../endpoint.log 2>&1 &)
                      for i in $(seq 1 10); do curl -sf -o /dev/null http://127.0.0.1:8765/index.json && break; sleep 1; done
                      composer config secure-http false
                      composer config extra.symfony.endpoint --json '["http://127.0.0.1:8765/index.json", "flex://defaults"]'
                      from='github.com/jpmmartin/SyliusShippingCarriersPlugin:main'
                  else
                      # Nothing configured: the store's own endpoints, which in Sylius Standard reach
                      # contrib through `flex://defaults` with `allow-contrib`.
                      from='github.com/symfony/recipes-contrib:main'
                  fi
                  composer require jpmmartin/sylius-shipping-carriers-plugin --no-interaction --no-progress 2>&1 | tee ../require.log
                  grep -q "Configuring jpmmartin/sylius-shipping-carriers-plugin (>=1.0): From $from" ../require.log \
                      || { echo "Flex did not apply the recipe from $from."; exit 1; }
                  grep -q 'Two things no recipe can do' ../require.log \
                      || { echo 'The post-install instructions were not printed.'; exit 1; }
                  composer recipes jpmmartin/sylius-shipping-carriers-plugin | grep -q 'up to date' \
                      || { echo 'The recipe is not recorded as installed in symfony.lock.'; exit 1; }
                  test -f config/packages/jpmmartin_shipping_carriers.yaml && test -f config/routes/jpmmartin_shipping_carriers.yaml \
                      || { echo 'The recipe did not copy its two files.'; exit 1; }
                  grep -q '###> jpmmartin/sylius-shipping-carriers-plugin ###' .gitignore \
                      || { echo 'The recipe did not add its .gitignore block.'; exit 1; }
                  grep -q '^JPMMARTIN_CARRIER_ENCRYPTION_KEY_PATH=' .env \
                      || { echo 'The recipe did not declare the key path in .env.'; exit 1; }

            # ── The upgrade path, up to the release before this one ─────────────────────────────────

            # HEAD^, not HEAD: on a release run HEAD carries the tag being published, and the store starts
            # from the one before it. On a pull request HEAD is the merge commit, whose first parent is the
            # base branch; dispatched, it is the branch's tip. No tag fails rather than skips: a leg that
            # goes green having upgraded nothing is the failure this workflow guards against elsewhere.
            - name: Find the release before this commit
              if: matrix.path == 'upgrade'
              run: |
                  set -euo pipefail
                  previous=$(git -C plugin describe --tags --abbrev=0 HEAD^ 2>/dev/null) \
                      || { echo 'No release before this commit to upgrade from. Were the tags checked out?'; exit 1; }
                  echo "Upgrading from $previous."
                  echo "PREVIOUS_RELEASE=${previous#v}" >> "$GITHUB_ENV"

            # From Packagist, with the recipe the store's own endpoints give it — contrib's, through
            # `flex://defaults` with `allow-contrib` — which is how a store that has it installed got it.
            - name: Install that release as a store would
              if: matrix.path == 'upgrade'
              working-directory: store
              run: |
                  set -euo pipefail
                  composer require "jpmmartin/sylius-shipping-carriers-plugin:$PREVIOUS_RELEASE" --no-interaction --no-progress 2>&1 | tee ../require.log
                  grep -qE 'Configuring jpmmartin/sylius-shipping-carriers-plugin \(>=[0-9.]+\): From github.com/symfony/recipes-contrib:main' ../require.log \
                      || { echo "Flex did not configure $PREVIOUS_RELEASE with the recipe from symfony/recipes-contrib."; exit 1; }

            # ── Both paths that install with the recipe ──────────────────────────────────────────────

            # What the recipe printed, done as printed: the commands come out of Composer's own output,
            # so a message that names the wrong command fails here rather than in a reader's store.
            - name: Do what the recipe said was left
              if: matrix.path != 'readme'
              working-directory: store
              run: |
                  set -euo pipefail
                  grep -oE 'bin/console [a-z:-]+' ../require.log | tee ../left.txt
                  test "$(wc -l < ../left.txt)" = '2' \
                      || { echo 'The recipe was expected to leave exactly two commands.'; exit 1; }
                  while IFS= read -r command <&3; do
                      echo "::group::$command"
                      eval "$command" < /dev/null
                      echo '::endgroup::'
                  done 3< ../left.txt

            # ── The upgrade path, from that release to this commit ───────────────────────────────────

            # Keys every 1.x release takes, at values none of which is a default, so that afterwards a value
            # that applies can be told from one that was dropped. Compiled with the release it was written
            # for, so that a mistake in the file is not taken for the upgrade's.
            - name: Give the store a configuration of its own
              if: matrix.path == 'upgrade'
              working-directory: store
              run: |
                  set -euo pipefail
                  cat > config/packages/carrier_settings_of_this_store.yaml <<'YAML'
                  jpm_martin_sylius_shipping_carriers:
                      rate_lifetime: 1200
                      rate_retention: 7200
                      tracking_lifetime: 600
                      label_formats:
                          ups: 'ZPL'
                      services:
                          ups:
                              '02': 'UPS 2nd Day Air'
                  YAML
                  bin/console cache:clear

            # Through the plugin's public surface only — the origin's interface, the calculator's name and
            # the configuration keys docs/extending.md names — so that any earlier 1.x release takes it.
            # The two pages that edit them are checked once the store is upgraded.
            - name: Leave what a store has by then
              if: matrix.path == 'upgrade'
              working-directory: store
              run: |
                  set -euo pipefail
                  cat > ../leave-data.php <<'PHP'
                  <?php
                  use App\Kernel;
                  use Symfony\Component\Dotenv\Dotenv;

                  require getcwd() . '/vendor/autoload.php';
                  (new Dotenv())->bootEnv(getcwd() . '/.env');
                  $kernel = new Kernel($_SERVER['APP_ENV'], (bool) $_SERVER['APP_DEBUG']);
                  $kernel->boot();
                  $container = $kernel->getContainer();

                  // The channel and the zone of Sylius's default fixtures.
                  $channel = $container->get('sylius.repository.channel')->findOneBy(['code' => 'FASHION_WEB'])
                      ?? throw new RuntimeException('No FASHION_WEB channel. Were the fixtures loaded?');
                  $zone = $container->get('sylius.repository.zone')->findOneBy(['code' => 'WORLD'])
                      ?? throw new RuntimeException('No WORLD zone. Were the fixtures loaded?');

                  $origin = $container->get('jpmmartin_carrier.factory.shipping_origin')->createNew();
                  $origin->setChannel($channel);
                  $origin->setCompanyName('The store');
                  $origin->setContactName('Ada Lovelace');
                  $origin->setPhone('3125550100');
                  $origin->setStreet('1 Main St');
                  $origin->setCity('Chicago');
                  $origin->setPostcode('60601');
                  $origin->setCountryCode('US');
                  $origin->setDefaultDestinationType('commercial');
                  $container->get('jpmmartin_carrier.repository.shipping_origin')->add($origin);

                  // A service the store's own configuration adds, charged at a flat amount when UPS fails.
                  $method = $container->get('sylius.factory.shipping_method')->createNew();
                  $method->setCode('ups_2nd_day_air');
                  $method->setEnabled(true);
                  $method->setZone($zone);
                  $method->addChannel($channel);
                  $method->setCurrentLocale('en_US');
                  $method->setFallbackLocale('en_US');
                  $method->setName('UPS 2nd Day Air');
                  $method->setCalculator('ups_rate');
                  $method->setConfiguration([
                      'service' => '02',
                      'failure_policy' => 'flat',
                      'flat_amount' => [$channel->getCode() => 1500],
                  ]);
                  $container->get('sylius.repository.shipping_method')->add($method);

                  printf("/admin/shipping-origins/%d/edit\n/admin/shipping-methods/%d/edit\n", $origin->getId(), $method->getId());
                  PHP
                  php ../leave-data.php | tee ../extra-pages.txt
                  test "$(wc -l < ../extra-pages.txt)" = '2'

            # Every table of the plugin and the shipping methods, in the columns each has now, one row a
            # line. Afterwards the same columns are read again: one the upgrade drops or renames is named,
            # and a value it changes shows in a diff. Columns the upgrade adds are not compared, because
            # what a new column holds is the new release's decision.
            - name: Note what the store holds
              if: matrix.path == 'upgrade'
              working-directory: store
              run: |
                  set -euo pipefail
                  cat > ../snapshot.php <<'PHP'
                  <?php
                  // snapshot.php before <dir>
                  // snapshot.php after <dir> <before-dir>
                  use App\Kernel;
                  use Symfony\Component\Dotenv\Dotenv;

                  require getcwd() . '/vendor/autoload.php';
                  (new Dotenv())->bootEnv(getcwd() . '/.env');
                  $kernel = new Kernel($_SERVER['APP_ENV'], (bool) $_SERVER['APP_DEBUG']);
                  $kernel->boot();
                  $connection = $kernel->getContainer()->get('doctrine')->getConnection();
                  $schema = $connection->createSchemaManager();
                  $columnsOf = static fn (string $table): array => array_values(array_map(
                      static fn ($column): string => $column->getName(),
                      $schema->listTableColumns($table),
                  ));

                  [, $mode, $dir] = $argv;
                  is_dir($dir) || mkdir($dir, 0777, true);

                  $tables = [];
                  if ('before' === $mode) {
                      foreach ($schema->listTableNames() as $table) {
                          if (str_starts_with($table, 'jpmmartin_carrier_') || 'sylius_shipping_method' === $table) {
                              $tables[$table] = $columnsOf($table);
                              file_put_contents("$dir/$table.columns", implode("\n", $tables[$table]) . "\n");
                          }
                      }
                  } else {
                      $lost = [];
                      $now = $schema->listTableNames();
                      foreach (glob($argv[3] . '/*.columns') as $file) {
                          $table = basename($file, '.columns');
                          $had = file($file, FILE_IGNORE_NEW_LINES);
                          if (!in_array($table, $now, true)) {
                              $lost[] = "the table $table";
                              continue;
                          }
                          foreach (array_diff($had, $columnsOf($table)) as $column) {
                              $lost[] = "$table.$column";
                          }
                          $tables[$table] = $had;
                      }
                      if ([] !== $lost) {
                          fwrite(STDERR, 'The upgrade dropped or renamed what the store had: ' . implode(', ', $lost) . ".\n");
                          exit(1);
                      }
                  }

                  // Sorted here rather than by the database: PostgreSQL cannot order by a json column.
                  foreach ($tables as $table => $columns) {
                      $select = implode(', ', array_map($connection->quoteIdentifier(...), $columns));
                      $rows = array_map(
                          static fn (array $row): string => json_encode($row, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR),
                          $connection->fetchAllAssociative("SELECT $select FROM " . $connection->quoteIdentifier($table)),
                      );
                      sort($rows);
                      file_put_contents("$dir/$table.rows", implode("\n", $rows) . "\n");
                  }
                  PHP
                  php ../snapshot.php before ../before
                  ls ../before
                  grep -q '"city":"Chicago"' ../before/jpmmartin_carrier_shipping_origin.rows \
                      || { echo 'The origin left for the upgrade is not in the snapshot.'; exit 1; }
                  grep -q '"calculator":"ups_rate"' ../before/sylius_shipping_method.rows \
                      || { echo 'The shipping method left for the upgrade is not in the snapshot.'; exit 1; }

            # Whatever version Composer guesses for a detached checkout, the path repository comes first
            # and is canonical, so it is the only place this package is looked for; `*@dev` is because the
            # release's own constraint takes no guessed version. Sylius Standard runs cache:clear as a
            # Composer script here, so a configuration this commit no longer takes fails in this step, with
            # the container's own message — as it would in a real store.
            - name: Upgrade to this commit
              if: matrix.path == 'upgrade'
              working-directory: store
              run: |
                  set -euo pipefail
                  composer config repositories.plugin '{"type": "path", "url": "../plugin", "options": {"symlink": false}}'
                  composer config minimum-stability dev
                  composer require 'jpmmartin/sylius-shipping-carriers-plugin:*@dev' --no-interaction --no-progress 2>&1 | tee ../upgrade.log
                  # Proven rather than assumed: a store left on the release would pass everything below.
                  for dir in src config; do
                      diff -rq "../plugin/$dir" "vendor/jpmmartin/sylius-shipping-carriers-plugin/$dir" \
                          || { echo "vendor/ does not hold this commit's $dir/. The store was not upgraded to it."; exit 1; }
                  done

            - name: Its configuration compiles as it was written, and still applies
              if: matrix.path == 'upgrade'
              working-directory: store
              run: |
                  set -euo pipefail
                  bin/console cache:clear
                  bin/console debug:config jpm_martin_sylius_shipping_carriers --format=json > ../config.json
                  php <<'PHP'
                  <?php
                  $config = json_decode(file_get_contents('../config.json'), true, 512, JSON_THROW_ON_ERROR)['jpm_martin_sylius_shipping_carriers'];
                  $applied = [
                      'rate_lifetime' => [$config['rate_lifetime'] ?? null, 1200],
                      'rate_retention' => [$config['rate_retention'] ?? null, 7200],
                      'tracking_lifetime' => [$config['tracking_lifetime'] ?? null, 600],
                      'label_formats.ups' => [$config['label_formats']['ups'] ?? null, 'ZPL'],
                      "services.ups.'02'" => [$config['services']['ups']['02'] ?? null, 'UPS 2nd Day Air'],
                  ];
                  foreach ($applied as $key => [$is, $written]) {
                      if ($is !== $written) {
                          fwrite(STDERR, sprintf("The store wrote %s: %s, and after the upgrade it is %s.\n", $key, var_export($written, true), var_export($is, true)));
                          exit(1);
                      }
                  }
                  echo "Every value the store wrote still applies.\n";
                  PHP

            # The one thing docs/upgrading.md asks of a store after any update.
            - name: Migrate, as docs/upgrading.md says
              if: matrix.path == 'upgrade'
              working-directory: store
              run: bin/console doctrine:migrations:migrate --no-interaction

            - name: What the store held is as it was
              if: matrix.path == 'upgrade'
              working-directory: store
              run: |
                  set -euo pipefail
                  php ../snapshot.php after ../after ../before
                  changed=''
                  for rows in ../before/*.rows; do
                      table=$(basename "$rows" .rows)
                      diff -u "$rows" "../after/$table.rows" || changed="$changed $table"
                  done
                  test -z "$changed" \
                      || { echo "The upgrade changed rows the store already had, in:$changed."; exit 1; }

            # ── What a half-finished install costs ───────────────────────────────────────────────────
            # Each of these fails silently in a real store, and each check names the step it belongs to.

            - name: The bundle registered
              working-directory: store
              run: |
                  bin/console debug:container --tag=sylius.shipping_calculator | grep -q 'ups_rate' \
                      || { echo 'UPS rates is not among the calculators. Step 2 — register the bundle.'; exit 1; }

            - name: The configuration and the routes were imported
              working-directory: store
              run: |
                  bin/console debug:config sylius_twig_hooks | grep -q 'JpmMartinSyliusShippingCarriersPlugin' \
                      || { echo "None of the plugin's hooks is registered. Step 3 — import the configuration."; exit 1; }
                  bin/console debug:router jpmmartin_carrier_admin_credentials_index | grep -q '/admin/carrier-credentials/' \
                      || { echo 'The admin routes are missing, or mounted outside /admin/. Step 3 — import the routes with their prefix.'; exit 1; }

            - name: The key exists, and git would not commit it
              working-directory: store
              run: |
                  test -s config/encryption/jpmmartin_carrier.key \
                      || { echo 'No key at config/encryption/jpmmartin_carrier.key. Step 4.'; exit 1; }
                  git check-ignore -q config/encryption/jpmmartin_carrier.key \
                      || { echo 'The key would be committed. Step 4 — the .gitignore line.'; exit 1; }

            - name: The migrations created the plugin's tables
              working-directory: store
              run: |
                  # Counted exactly. `grep -q 11` would match an 11 anywhere in the table the console draws.
                  tables=$(bin/console dbal:run-sql \
                      "SELECT count(*) AS n FROM information_schema.tables WHERE table_name LIKE 'jpmmartin_carrier_%'" \
                      | grep -oE '[0-9]+' | tail -1)
                  test "$tables" = '11' \
                      || { echo "Expected 11 plugin tables, found ${tables:-none}. Step 5 — run the migrations."; exit 1; }

            # Everything above proves the parts exist. Nothing proves a page renders — and a route the menu
            # links to that does not exist, or a missing table, shows up here, loudly.
            - name: The shop and the admin answer
              working-directory: store
              run: |
                  cat > public/router.php <<'PHP'
                  <?php
                  // PHP's built-in server hands static files back itself and everything else to Symfony.
                  if (is_file(__DIR__ . parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH))) {
                      return false;
                  }
                  require __DIR__ . '/index.php';
                  PHP
                  # `variables_order=EGPCS`, because PHP's built-in server hands the environment to getenv()
                  # only, and Symfony's Dotenv looks in $_SERVER and $_ENV before falling back to the store's
                  # .env, whose database is not this one.
                  php -S 127.0.0.1:8000 -d variables_order=EGPCS -t public public/router.php > server.log 2>&1 &
                  for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
                  status=$(curl -s -o homepage.html -w '%{http_code}' http://127.0.0.1:8000/en_US/)
                  test "$status" = '200' \
                      || { echo "The shop's homepage answered $status."; grep -o '<title>[^<]*' homepage.html | head -1; exit 1; }
                  # The fixtures' administrator. The admin draws the plugin's menu on every page, so a
                  # missing route shows up on the dashboard; the credentials page reads the plugin's table.
                  jar=$(mktemp)
                  token=$(curl -s -c "$jar" -b "$jar" http://127.0.0.1:8000/admin/login \
                      | grep -oE 'name="_csrf_admin_security_token" value="[^"]+"' | cut -d'"' -f4)
                  curl -s -o /dev/null -c "$jar" -b "$jar" -X POST http://127.0.0.1:8000/admin/login-check \
                      --data-urlencode '_username=sylius' --data-urlencode '_password=sylius' \
                      --data-urlencode "_csrf_admin_security_token=$token"
                  for page in /admin/ /admin/carrier-credentials/; do
                      status=$(curl -s -o page.html -w '%{http_code}' -b "$jar" "http://127.0.0.1:8000$page")
                      test "$status" = '200' \
                          || { echo "$page answered $status."; grep -o '<title>[^<]*' page.html | head -1; tail -20 server.log; exit 1; }
                  done
                  grep -q 'Carrier credentials' page.html \
                      || { echo 'The credentials page does not say what it is.'; exit 1; }
                  # The upgrade leg's own data, edited with this commit's code: a stored key or a calculator
                  # it no longer understands shows up here.
                  if [ -f ../extra-pages.txt ]; then
                      while IFS= read -r page; do
                          status=$(curl -s -o page.html -w '%{http_code}' -b "$jar" "http://127.0.0.1:8000$page")
                          test "$status" = '200' \
                              || { echo "$page answered $status."; grep -o '<title>[^<]*' page.html | head -1; tail -20 server.log; exit 1; }
                      done < ../extra-pages.txt
                  fi

            # ── The recipe path, undone ──────────────────────────────────────────────────────────────

            # Flex unconfigures what it configured. A store that tries the plugin and takes it out again
            # must be left as it was found — all but the key, which is the operator's secret.
            - name: Removing the package removes what the recipe added
              if: matrix.path == 'recipe'
              working-directory: store
              run: |
                  set -euo pipefail
                  composer remove jpmmartin/sylius-shipping-carriers-plugin --no-interaction --no-progress
                  ! grep -q 'JpmMartinSyliusShippingCarriersPlugin' config/bundles.php \
                      || { echo 'The bundle line survived composer remove.'; exit 1; }
                  test ! -e config/packages/jpmmartin_shipping_carriers.yaml && test ! -e config/routes/jpmmartin_shipping_carriers.yaml \
                      || { echo 'A copied file survived composer remove.'; exit 1; }
                  ! grep -q 'jpmmartin/sylius-shipping-carriers-plugin' .gitignore \
                      || { echo 'The .gitignore block survived composer remove.'; exit 1; }
                  ! grep -q 'JPMMARTIN_CARRIER_ENCRYPTION_KEY_PATH' .env \
                      || { echo 'The .env block survived composer remove.'; exit 1; }
