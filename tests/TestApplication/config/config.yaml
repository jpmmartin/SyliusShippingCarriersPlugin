imports:
    - { resource: "@JpmMartinSyliusShippingCarriersPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Kernel for EncrypterWithoutPaymentEncryptionTest: Sylius payment encryption off, so the test proves
# the plugin's encrypter does not depend on it. The name does not start with "test" on purpose:
# services_test.php would otherwise import the Behat services, whose bundle is only enabled for "test".
when@no_payment_encryption:
    framework:
        test: true
    sylius_payment:
        encryption:
            enabled: false

# Kernel for RateCachePoolTest: an application points the rate cache at another adapter from its own
# configuration. Not named "test…" for the same reason as above.
when@rate_cache_in_memory:
    framework:
        test: true
        cache:
            pools:
                jpmmartin_carrier.cache.rates:
                    adapter: cache.adapter.array

# Kernel for PackagingStrategyReplacementTest: an application replaces the packaging strategy by pointing the
# plugin's alias at a service of its own. Not named "test…" for the same reason as above.
when@packaging_strategy_replaced:
    framework:
        test: true
    services:
        Tests\JpmMartin\SyliusShippingCarriersPlugin\Integration\Packaging\AnotherPackagingStrategy: ~
        jpmmartin_carrier.packaging_strategy:
            alias: Tests\JpmMartin\SyliusShippingCarriersPlugin\Integration\Packaging\AnotherPackagingStrategy

# Kernel for CarrierRateCalculatorRegistrationTest: an application adds a service to a carrier's list and
# renames one of the plugin's. Not named "test…" for the same reason as above.
when@carrier_services_extended:
    framework:
        test: true
    jpm_martin_sylius_shipping_carriers:
        services:
            ups:
                '12': 'A service added by the application'
                '03': 'Ground, renamed by the application'

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\JpmMartin\SyliusShippingCarriersPlugin
