# Put your Behat suites definitions here.
#
# The empty mapping below is deliberate: with no suites configured at all, Behat
# falls back to an implicit "default" suite bound to a FeatureContext class that
# this plugin does not have, and every run dies before it starts. Declaring the
# list as explicitly empty keeps `vendor/bin/behat` green until the first real
# suite lands.
#
# default:
#     suites:
#         managing_something:
#             contexts:
#                 - jpm_martin_sylius_shipping_carriers.context.ui.admin.something
#             filters:
#                 tags: "@managing_something"

default:
    suites: {}
