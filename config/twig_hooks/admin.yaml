sylius_twig_hooks:
    hooks:
        # The customs data of a variant is declared where the variant is edited, as one more section of its
        # form. Negative priority so it comes after the sections Sylius ships with.
        'sylius_admin.product_variant.create.content.form.side_navigation':
            jpmmartin_carrier_customs_data:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/side_navigation/customs_data.html.twig'
                priority: -100

        'sylius_admin.product_variant.update.content.form.side_navigation':
            jpmmartin_carrier_customs_data:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/side_navigation/customs_data.html.twig'
                priority: -100

        'sylius_admin.product_variant.create.content.form.sections':
            jpmmartin_carrier_customs_data:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/sections/customs_data.html.twig'
                priority: -100

        'sylius_admin.product_variant.update.content.form.sections':
            jpmmartin_carrier_customs_data:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/sections/customs_data.html.twig'
                priority: -100

        'sylius_admin.product_variant.create.content.form.sections.jpmmartin_carrier_customs_data':
            header:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/sections/customs_data/header.html.twig'
                priority: 100
            body:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/sections/customs_data/body.html.twig'
                priority: 0

        'sylius_admin.product_variant.update.content.form.sections.jpmmartin_carrier_customs_data':
            header:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/sections/customs_data/header.html.twig'
                priority: 100
            body:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/product_variant/form/sections/customs_data/body.html.twig'
                priority: 0

        # The list of variants customs could not be told about falls through to Sylius's shared index page;
        # only its heading is its own.
        'jpmmartin_carrier_admin.incomplete_customs_data.index.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
                configuration:
                    title: jpmmartin_carrier.ui.incomplete_customs_data
                priority: 100

        # Issuing the labels of a shipment is one more action of that shipment, next to the ones Sylius
        # ships. Nothing is offered for a shipment of another shipping method.
        'sylius_admin.order.show.content.sections.shipments.item.actions':
            jpmmartin_carrier_issue_labels:
                template: '@JpmMartinSyliusShippingCarriersPlugin/admin/order/show/content/sections/shipments/item/actions/issue_labels.html.twig'
                priority: 150
