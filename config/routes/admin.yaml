# Classic `sylius.resource` routes, the way Sylius 2.2 declares its own admin CRUD
# (AdminBundle/Resources/config/routing/tax_category.yml). Not #[AsResource]: it would register the
# resource a second time, and its delete operations skip the CSRF check ResourceController does.
#
# Import this file under the admin prefix, e.g. `prefix: '/%sylius_admin.path_name%'`.

jpmmartin_carrier_admin_shipping_origin:
    resource: |
        alias: jpmmartin_carrier.shipping_origin
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        except: ['show']
        redirect: update
        grid: jpmmartin_carrier_admin_shipping_origin
        form:
            type: JpmMartin\SyliusShippingCarriersPlugin\Form\Type\CarrierShippingOriginType
        permission: true
    type: sylius.resource

jpmmartin_carrier_admin_package_box:
    resource: |
        alias: jpmmartin_carrier.package_box
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        except: ['show']
        redirect: update
        grid: jpmmartin_carrier_admin_package_box
        form:
            type: JpmMartin\SyliusShippingCarriersPlugin\Form\Type\CarrierPackageBoxType
        permission: true
    type: sylius.resource

jpmmartin_carrier_admin_credentials:
    resource: |
        alias: jpmmartin_carrier.credentials
        path: carrier-credentials
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        except: ['show']
        redirect: update
        grid: jpmmartin_carrier_admin_credentials
        form:
            type: JpmMartin\SyliusShippingCarriersPlugin\Form\Type\CarrierCredentialsType
        permission: true
    type: sylius.resource

# The variants customs could not be told about. Read-only: the data itself is edited on the variant.
#
# A plain route on Sylius's own controller, not a `sylius.resource` one: a resource route for an alias that is
# not ours would take over the name of Sylius's variant index, `sylius_admin_product_variant_index`.
jpmmartin_carrier_admin_incomplete_customs_data_index:
    path: /incomplete-customs-data
    methods: [GET]
    defaults:
        _controller: sylius.controller.product_variant::indexAction
        _sylius:
            section: admin
            template: "@JpmMartinSyliusShippingCarriersPlugin/admin/incomplete_customs_data/index.html.twig"
            grid: jpmmartin_carrier_admin_incomplete_customs_data
            permission: true

# The only way to a document of the plugin: the storage is private and outside the published directory.
jpmmartin_carrier_admin_document_download:
    path: /carrier-documents/{path}
    methods: [GET]
    requirements:
        path: ".+"
    defaults:
        _controller: jpmmartin_carrier.controller.admin.download_document

# Issuing the labels of a shipment is always something an administrator asked for, never a side effect, so it
# is its own route and it only answers to POST.
jpmmartin_carrier_admin_shipment_issue_labels:
    path: /carrier-shipments/{id}/issue-labels
    methods: [POST]
    requirements:
        id: \d+
    defaults:
        _controller: jpmmartin_carrier.controller.admin.issue_labels

# The same action for the shipments picked in the grid. POST only, and with the same token as the single one.
jpmmartin_carrier_admin_shipments_issue_labels:
    path: /carrier-shipments/issue-labels
    methods: [POST]
    defaults:
        _controller: jpmmartin_carrier.controller.admin.issue_labels_in_batch
